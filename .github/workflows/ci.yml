# ============================================================================
# CI — typecheck + build du frontend à chaque push/PR
# ============================================================================
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/**'
      - 'scripts/test-ecom-stock-mapping.sql'
      - 'scripts/test-prospect-admin-audit.sql'
      - 'scripts/recover-prospect-assignments.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-migrations.yml'
      - '.github/workflows/deploy-edge-functions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/**'
      - 'scripts/test-ecom-stock-mapping.sql'
      - 'scripts/test-prospect-admin-audit.sql'
      - 'scripts/recover-prospect-assignments.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-migrations.yml'
      - '.github/workflows/deploy-edge-functions.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prospect-admin-audit:
    name: Prospect admin audit integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: aurel_prospect_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test admin prospect audit in disposable database
        env:
          PGPASSWORD: local-test-only
        run: psql -h localhost -U postgres -d aurel_prospect_audit_test -v ON_ERROR_STOP=1 -f scripts/test-prospect-admin-audit.sql

  ecom-stock-mapping:
    name: E-com stock mapping integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: aurel_stock_mapping_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test actual migration in disposable database
        env:
          PGPASSWORD: local-test-only
        run: psql -h localhost -U postgres -d aurel_stock_mapping_test -v ON_ERROR_STOP=1 -f scripts/test-ecom-stock-mapping.sql

  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # SHERLOCK R13 — C2: typecheck is BLOCKING. esbuild/Vite doesn't run tsc
      # at build time, so without this step a "any" creep or a missing prop
      # ships to prod silently. If a TS error lands in main, the deploy stops
      # here instead of after Cloudflare has already swapped the bundle.
      - name: TypeScript check
        run: npm run lint

      - name: Security and workflow contracts
        run: npm test

      - name: Build
        env:
          # On utilise des placeholders pour le build CI (le vrai déploiement
          # injecte ses propres VITE_* via Cloudflare Pages env vars).
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_placeholder
          VITE_VDOCIPHER_API_KEY: placeholder
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: app/dist
          retention-days: 7
