# ============================================================================
# CI — typecheck + build du frontend à chaque push/PR
# ============================================================================
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          # Pas de cache — on ne commit pas le lockfile (Windows binaries cross-platform issue).

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # SHERLOCK R13 — C2: typecheck is BLOCKING. esbuild/Vite doesn't run tsc
      # at build time, so without this step a "any" creep or a missing prop
      # ships to prod silently. If a TS error lands in main, the deploy stops
      # here instead of after Cloudflare has already swapped the bundle.
      - name: TypeScript check
        run: npm run lint

      - name: Build
        env:
          # On utilise des placeholders pour le build CI (le vrai déploiement
          # injecte ses propres VITE_* via Cloudflare Pages env vars).
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_placeholder
          VITE_VDOCIPHER_API_KEY: placeholder
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: app/dist
          retention-days: 7
