# ============================================================================
# CI — typecheck + build du frontend à chaque push/PR
# ============================================================================
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Pas de cache — on ne commit pas le lockfile (Windows binaries cross-platform issue).

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # TypeScript check non bloquant (esbuild/Vite ne fait pas de typecheck au build,
      # donc des erreurs TS ne cassent pas la prod). Visible dans les logs.
      - name: TypeScript check (non blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build
        env:
          # On utilise des placeholders pour le build CI (le vrai déploiement
          # injecte ses propres VITE_* via Cloudflare Pages env vars).
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_placeholder
          VITE_VDOCIPHER_API_KEY: placeholder
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: app/dist
          retention-days: 7
