# ============================================================================
# Deploy Supabase Edge Functions.
#   - Automatically on push to main touching functions/config.
#   - Manually via the Actions "Run workflow" button (workflow_dispatch) — the
#     RUNBOOK's recovery step relies on this trigger being present.
# ============================================================================
name: Deploy Edge Functions

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'

# SHERLOCK FIX: explicit least-privilege — this job only reads the repo.
permissions:
  contents: read

concurrency:
  group: edge-functions-deploy
  cancel-in-progress: false  # never interrupt an in-flight deploy

jobs:
  deploy:
    name: Deploy all edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Deploy every function (resilient — one failure never skips the rest)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail

          # Fail fast with a clear message if the required secrets are missing,
          # instead of the first `supabase functions deploy` failing cryptically.
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF is not set — see .github/SECRETS.md"
            exit 1
          fi

          failed=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            if [ "$name" = "_shared" ]; then
              echo "skip _shared (shared utilities, not an endpoint)"
              continue
            fi
            if [ ! -f "$dir/index.ts" ]; then
              echo "skip $name (no index.ts)"
              continue
            fi

            echo "=== deploying $name ==="
            # CRITICAL: do NOT abort the loop on a single failure. This step used
            # to run under `set -e`, so if any function failed to bundle (e.g. a
            # transient esm.sh fetch), the loop died and every function AFTER it
            # alphabetically was silently never deployed — that shipped a stale
            # vdocipher-otp (last in the list) for weeks. Collect failures, keep
            # going, and fail the job at the end so nothing is silently skipped.
            #
            # We intentionally do NOT pass --no-verify-jwt: each function's
            # verify_jwt setting comes from supabase/config.toml.
            if ! supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "::error::deploy failed for $name"
              failed="$failed $name"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::one or more functions failed to deploy:$failed"
            exit 1
          fi
          echo "All functions deployed."
