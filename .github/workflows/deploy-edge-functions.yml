# ============================================================================
# Auto-deploy Supabase Edge Functions sur push vers main
# ============================================================================
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'

# SHERLOCK FIX : explicit permissions block. Avant : default GITHUB_TOKEN
# scope (souvent write-all selon repo settings) → trop large pour un job
# qui ne fait que checkout + deploy.
permissions:
  contents: read

concurrency:
  group: edge-functions-deploy
  cancel-in-progress: false  # ne pas couper un déploiement en cours

jobs:
  deploy:
    name: Deploy all edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy all functions (auto-discover from supabase/functions/)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          # Liste des fonctions = chaque dossier dans supabase/functions/ qui a un index.ts
          # On ignore _shared (utilitaires partagés, pas un endpoint).
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            # Skip _shared (modules partagés)
            if [ "$name" = "_shared" ]; then
              echo "⏭ Skipping _shared (utilities)"
              continue
            fi
            if [ ! -f "$dir/index.ts" ]; then
              echo "⏭ Skipping $name (no index.ts)"
              continue
            fi
            echo "═══════════════════════════════════════════"
            echo "→ Deploying function: $name"
            echo "═══════════════════════════════════════════"
            # SHERLOCK FIX : on NE passe PLUS `--no-verify-jwt` en blanket.
            # Avant, ce flag overridait silencieusement le `verify_jwt = true`
            # de send-email dans config.toml → la function était deployée
            # sans JWT gate côté gateway Supabase. Maintenant la valeur du
            # config.toml fait foi : chaque function a son setting explicite.
            supabase functions deploy "$name" \
              --project-ref "$SUPABASE_PROJECT_REF"
          done
          echo ""
          echo "✅ All functions deployed."
