# ============================================================================
# Aurel Academy — Secrets scan via gitleaks
# Scanne chaque push + PR pour détecter des secrets accidentellement committés.
#
# - Sur push main / PR → scan complet du repo et des modifs
# - Bloque le merge si secret détecté (PR check fail)
# - Possible aussi en manuel (workflow_dispatch) pour scan rétroactif full history
# ============================================================================

name: Secrets scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# SHERLOCK FIX : on `pull_request` (pas `pull_request_target`), GITHUB_TOKEN
# est read-only pour les PRs externes — les permissions write listées avant
# étaient ignorées par GitHub. On les retire pour clarifier l'intent et
# éviter de signaler une attack surface qui n'existe pas réellement.
# (Si plus tard on veut commenter sur les PRs, switcher en pull_request_target
# AVEC un actions/checkout du PR head ET pas de `run:` qui exécute le code PR.)
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history pour le scan complet (--log-opts=--all)
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        # Ne pas utiliser GITLEAKS_LICENSE — on est en open source / public
