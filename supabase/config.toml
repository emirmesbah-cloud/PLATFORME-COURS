project_id = "dvrqtqghgaxhhgkoihcj"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://app.aurel-academy.com"
additional_redirect_urls = ["https://app.aurel-academy.com/**", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = false  # ← inscription via edge function activate-account uniquement

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

# ────────────────────────────────────────────────────────────────────────────
# Edge Functions
#
# IMPORTANT (Sherlock fix) : la valeur effective dépend du flag passé à
# `supabase functions deploy`. Le workflow CI passait `--no-verify-jwt` à
# TOUTES les functions sans condition, ce qui désactivait silencieusement le
# JWT gate pour `send-email` et autres. Maintenant le workflow drop le flag
# global et lit la valeur depuis ce fichier (`supabase functions deploy <name>
# --import-map ... ` sans le flag). Référence Supabase CLI : la valeur du
# config.toml est appliquée au déploiement quand `--no-verify-jwt` n'est pas
# spécifié.
# ────────────────────────────────────────────────────────────────────────────
[functions.activate-account]
verify_jwt = false  # endpoint public, l'user n'est pas encore authentifié

[functions.send-email]
# DOIT rester JWT-required côté gateway. Le check serveur exige en plus un
# bearer service_role OU un x-cron-secret (server-to-server only). Aucun
# flow client direct.
verify_jwt = true

[functions.check-inactive-users]
verify_jwt = false  # cron-only — protégé par CRON_SECRET header/query

[functions.health]
verify_jwt = false  # health probe public (uptime monitoring)

[functions.sentry-test]
verify_jwt = false  # canary — protégé par CRON_SECRET (déclenché manuellement)

[functions.telegram-test]
verify_jwt = false  # canary — protégé par CRON_SECRET

[functions.smoke-test]
verify_jwt = false  # CI smoke — protégé par CRON_SECRET

[functions.uptimerobot-webhook]
verify_jwt = false  # webhook externe (UptimeRobot ne peut pas signer un JWT) — protégé par UPTIMEROBOT_WEBHOOK_TOKEN

[functions.admin-purge-user]
# DOIT rester JWT-required côté gateway. La RPC SQL appelée derrière vérifie
# en plus is_admin(auth.uid()) — defense en profondeur.
verify_jwt = true

[functions.vdocipher-otp]
# JWT-required at the gateway; the function ALSO re-verifies via getUser and
# checks course entitlement (course_access) + revoked_at server-side.
verify_jwt = true

[functions.ecom-delivery]
# Admin-only bridge. The function re-verifies the caller and keeps E-com API
# credentials in server secrets, never in the Vite/browser bundle.
verify_jwt = true

[functions.ecom-webhook]
# Public callback from E-com Delivery. Protected by HMAC-SHA256 signature,
# timestamp freshness and idempotent event IDs.
verify_jwt = false

[functions.webinar-lead]
# Public post-webinar form. Validated, throttled and written with service_role;
# no anonymous table INSERT policy is exposed.
verify_jwt = false

[functions.closer-access]
# Admin-managed closer provisioning + authenticated password-change notices.
# There is no public closer self-registration.
verify_jwt = true

[functions.webinar-rotate]
# Public WhatsApp group rotation resolver, called by the WordPress merci page.
# No login (the visitor is anonymous) — gated instead by a shared secret header
# X-Rotate-Secret, so only the merci page can reach it. All counting is atomic
# server-side via the assign_webinar_group RPC (service_role).
verify_jwt = false
