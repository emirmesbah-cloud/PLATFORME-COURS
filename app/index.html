<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F97316" />
    <!-- SHERLOCK R6 fix : disable iOS auto-linking of phone numbers in body
         text. Aurel can show numbers in profiles/admin views — without this
         they'd become unstyled blue tap-to-call links. -->
    <meta name="format-detection" content="telephone=no" />
    <title>Aurel Academy — Espace étudiant</title>
    <meta name="description" content="Plateforme étudiant Aurel Academy : Deutsch für Pflegekräfte." />
    <meta name="robots" content="noindex,nofollow" />

    <!-- Favicon + PWA icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#F97316" />

    <!-- iOS Safari : standalone mode + status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- SHERLOCK R6 fix : black-translucent gives white status-bar text over
         the orange app theme (vs default's black on translucent white which
         was unreadable). Layout must reserve env(safe-area-inset-top). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurel Academy" />

    <!-- Android Chrome : mobile web app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Aurel Academy" />

    <!-- SHERLOCK R23 PERF : preconnect to backends so the browser starts
         the TLS handshake in parallel with HTML parsing. Saves ~150-200ms
         on the first API call vs cold start. -->
    <link rel="preconnect" href="https://dvrqtqghgaxhhgkoihcj.supabase.co" crossorigin />
    <link rel="preconnect" href="https://player.vdocipher.com" />
    <link rel="dns-prefetch" href="https://dvrqtqghgaxhhgkoihcj.supabase.co" />
    <link rel="dns-prefetch" href="https://player.vdocipher.com" />

    <!-- Linear Tech / Aurel design system fonts : Geist (sans) + Geist Mono.
         Preconnect + preload critical weights to avoid FOUT on first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-aurel-ink antialiased">
    <noscript>
      <div style="max-width:480px;margin:80px auto;padding:32px;text-align:center;font-family:system-ui,sans-serif;">
        <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:#F97316;display:flex;align-items:center;justify-content:center;color:white;font-size:32px;font-weight:bold;font-style:italic;">A</div>
        <h1 style="color:#1A1A1A;font-size:20px;margin:0 0 8px;">Aurel Academy</h1>
        <p style="color:#475569;font-size:14px;line-height:1.6;">
          Cette application nécessite que JavaScript soit activé dans ton navigateur.
          Active JavaScript et recharge la page pour accéder à ton espace étudiant.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
