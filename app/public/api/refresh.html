<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Mise à jour Aurel Academy</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8f1; color: #18181b; font-family: system-ui, sans-serif; }
      main { width: min(420px, calc(100% - 40px)); padding: 28px; border: 1px solid #fed7aa; border-radius: 18px; background: #fff; text-align: center; }
      .mark { width: 52px; height: 52px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 14px; background: #f97316; color: #fff; font-size: 28px; font-weight: 800; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0; color: #52525b; font-size: 14px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">A</div>
      <h1>Mise à jour en cours…</h1>
      <p id="status">Nettoyage de l’ancienne version, sans supprimer ta connexion.</p>
    </main>
    <script src="/api/refresh.js"></script>
  </body>
</html>
